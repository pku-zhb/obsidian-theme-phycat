<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phycat 正文色方案对比：带色调 vs 中性 vs 微调</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', serif;
    background: #1a1a2e; color: #eee;
    padding: 24px 16px; line-height: 1.8;
  }
  h1 { text-align: center; font-size: 1.3em; margin-bottom: 4px; color: #fff; }
  .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 0.8em; }
  .legend {
    max-width: 1500px; margin: 0 auto 16px; padding: 10px 18px;
    background: rgba(255,255,255,0.05); border-radius: 10px;
    font-size: 0.78em; color: #aaa; line-height: 2;
  }
  .legend strong { color: #ddd; }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 4px;
    font-size: 0.88em; font-weight: 700; margin: 0 2px;
  }
  .section-title {
    text-align: center; font-size: 1em; margin: 30px 0 14px;
    padding: 6px 0; border-bottom: 1px solid #333; color: #bbb;
  }
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(800px, 1fr));
    gap: 16px; max-width: 1500px; margin: 0 auto;
  }
  .theme-card {
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 3px 16px rgba(0,0,0,0.3);
  }
  .theme-card-header {
    padding: 7px 14px; font-weight: 700; font-size: 0.82em;
    display: flex; align-items: center; gap: 8px;
  }
  .seeds { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  .seeds .label { font-size: 0.68em; opacity: 0.5; font-weight: 400; margin-right: 3px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block; border: 1.5px solid rgba(0,0,0,0.12);
  }
  .theme-card-body { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .col { padding: 12px 14px; }
  .col + .col { border-left: 1px dashed rgba(0,0,0,0.08); }
  .col-label {
    font-size: 0.62em; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px;
    opacity: 0.45; font-weight: 700;
  }
  .text-sample { font-size: 0.82em; line-height: 2.1; }
  .text-sample .line { margin-bottom: 3px; }
  .b { font-weight: 700; }
  .i-wave {
    font-style: italic; padding-bottom: 2px;
    background-repeat: repeat-x;
    background-position: 0 100%;
    background-size: 6px 3px;
  }
  .mark-grad {
    padding: 0 3px; border-radius: 3px;
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 100% 55%;
  }
  .s { text-decoration: line-through; }
  .meta {
    font-size: 0.58em; font-family: monospace; opacity: 0.4;
    margin-top: 4px; line-height: 1.6;
  }
  /* heading preview */
  .heading-row {
    margin-top: 6px; padding-top: 6px;
    border-top: 1px dashed rgba(0,0,0,0.06);
    font-size: 0.82em;
  }
  .h3-preview {
    font-size: 1.05em; font-weight: 700;
    padding-left: 14px; position: relative; margin-bottom: 2px;
  }
  .h3-preview::before {
    content: ''; position: absolute; left: 0; top: 3px;
    width: 4px; height: 80%; border-radius: 2px;
  }
  .link-preview {
    position: relative; padding: 0 2px; font-weight: 500;
    text-decoration: none; cursor: pointer;
  }
  .link-preview::before { content: '['; opacity: 0.5; margin-right: 1px; }
  .link-preview::after { content: ']'; opacity: 0.5; margin-left: 1px; }
  .tag-preview {
    display: inline-block; padding: 0 6px; border-radius: 4px;
    font-size: 0.85em; font-weight: 500;
  }
  .bullet-row { padding-left: 18px; position: relative; }
  .bullet-row::before {
    content: ''; position: absolute; left: 4px; top: 50%;
    width: 6px; height: 6px; border-radius: 50%; transform: translateY(-50%);
  }

  /* Dark ref */
  .dark-ref {
    max-width: 1500px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  }
  .dark-card {
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 3px 16px rgba(0,0,0,0.3);
  }
  .dark-card-header {
    padding: 7px 14px; font-weight: 700; font-size: 0.82em;
    display: flex; align-items: center; gap: 8px;
  }
  .dark-card-body { padding: 12px 14px; }
  .dark .col + .col { border-left-color: rgba(255,255,255,0.06); }
</style>
</head>
<body>

<h1>正文色实验：3 种子色能否统一亮暗？</h1>
<p class="subtitle">如果亮色正文改为中性色，primary/secondary 就能像暗色模式一样直接做强调</p>

<div class="legend">
  <span class="tag" style="background:rgba(255,255,255,0.1);color:#ff6b6b">A 现状</span> 带色调正文 + 手选强调色（需 5 种子）<br>
  <span class="tag" style="background:rgba(255,255,255,0.1);color:#50fa7b">B 中性黑</span> 纯中性正文 #2d2d2d + primary/secondary 直接强调（3 种子）<br>
  <span class="tag" style="background:rgba(255,255,255,0.1);color:#8be9fd">C 微调</span> 正文带极轻色调 + primary 加深做粗体 + secondary 加深做斜体（3 种子）<br>
  <br>
  <strong>关注点：</strong>① 正文的阅读舒适度和主题氛围 ② 粗体/斜体是否足够突出 ③ 标题竖条、链接括号、标签等装饰元素
</div>

<div class="section-title">☀️ 浅色模式 — 三种正文色策略</div>
<div class="theme-grid" id="grid"></div>

<div class="section-title">🌙 暗色参考 — 3 种子色天然够用</div>
<div class="dark-ref" id="dark-grid"></div>

<script>
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function rgbToHex(r,g,b) {
  return '#'+[r,g,b].map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('');
}
function rgba(hex,a) { const [r,g,b]=hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function darken(hex,p) { const [r,g,b]=hexToRgb(hex); const f=1-p; return rgbToHex(r*f,g*f,b*f); }
function mixWith(hex, target, pct) {
  const [r1,g1,b1]=hexToRgb(hex);
  const [r2,g2,b2]=hexToRgb(target);
  return rgbToHex(r1+(r2-r1)*pct, g1+(g2-g1)*pct, b1+(b2-b1)*pct);
}
function wave(c) { return `linear-gradient(-45deg, transparent 35%, ${c} 35%, ${c} 65%, transparent 65%)`; }
function hlGrad(hex,a) { return `linear-gradient(to top, ${rgba(hex,a)}, transparent)`; }
function luminance(hex) {
  let [r,g,b]=hexToRgb(hex).map(c=>{c=c/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b;
}
function contrast(a,b) { const l1=luminance(a),l2=luminance(b); return ((Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05)).toFixed(1); }

// Generate a subtle tinted near-black from bg
function subtleTint(bg) {
  // Mix bg hue into a dark base at ~8% to get barely perceptible tint
  return mixWith('#2a2a2a', bg, 0.08);
}

const themes = [
  {
    name: '🌸 Sakura', bg: '#fff7fa', primary: '#ff7096', secondary: '#bd93f9',
    textOld: '#3f3a3b', boldOld: '#e91e63', italicOld: '#0277bd',
    // For this theme, primary/secondary already contrast well with neutral text
  },
  {
    name: '☁️ Sky', bg: '#f4faff', primary: '#3498db', secondary: '#c56200',
    textOld: '#0a1112', boldOld: '#1a5276', italicOld: '#c56200',
    // Sky already has good secondary contrast; primary needs slight darkening
  },
  {
    name: '🌲 Forest', bg: '#f2f9f5', primary: '#11aa63', secondary: '#8e24aa',
    textOld: '#5c7066', boldOld: '#8e24aa', italicOld: '#bf6c00',
    // Problem theme: green text + green primary
  },
  {
    name: '🌊 Mint', bg: '#f4fdff', primary: '#3db8bf', secondary: '#c2185b',
    textOld: '#546e7a', boldOld: '#c2185b', italicOld: '#e65100',
    // Problem theme: blue-gray text + teal primary
  },
  {
    name: '🟣 Mauve', bg: '#fafafc', primary: '#a06eb4', secondary: '#00838f',
    textOld: '#6a3f7a', boldOld: '#00838f', italicOld: '#c56200',
    // Problem theme: purple text + purple primary
  },
  {
    name: '🌅 Golden Hour', bg: '#fffbeb', primary: '#f59e0b', secondary: '#4527a0',
    textOld: '#92400e', boldOld: '#4527a0', italicOld: '#00796b',
    // Problem theme: brown text + gold primary
  },
  {
    name: '🍒 Cheery', bg: '#fffbfb', primary: '#aa1141', secondary: '#00695c',
    textOld: '#870e0e', boldOld: '#00695c', italicOld: '#4527a0',
    // Problem theme: red text + red primary
  },
  {
    name: '⚓ Prussian', bg: '#f0f6fa', primary: '#1d4e89', secondary: '#c62828',
    textOld: '#1d4e89', boldOld: '#c62828', italicOld: '#bf6c00',
    // Problem theme: blue text = primary
  },
];

const darkThemes = [
  { name: '🧛 Vampire', bg: '#282a36', text: '#f8f8f2', primary: '#ff5555', secondary: '#bd93f9', headerBg: '#343746' },
  { name: '🌌 Abyss', bg: '#0f111a', text: '#d6deeb', primary: '#00b7c0', secondary: '#2e8bd6', headerBg: '#1a1d2e' },
  { name: '☢️ Radiation', bg: '#1b1d1b', text: '#e6e6e6', primary: '#4cd964', secondary: '#ffc107', headerBg: '#262826' },
];

function renderCard(t) {
  const neutralText = '#2d2d2d';
  const tintedText = subtleTint(t.bg);

  // Strategy B: neutral text, bold=darken(primary,15%), italic=darken(secondary,15%)
  const boldB = darken(t.primary, 0.15);
  const italicB = darken(t.secondary, 0.15);

  // Strategy C: very subtle tint text, bold=darken(primary,20%), italic=darken(secondary,20%)
  const boldC = darken(t.primary, 0.20);
  const italicC = darken(t.secondary, 0.20);

  const hl = hlGrad(t.primary, 0.35);

  function renderCol(label, textC, boldC, italicC, boldLabel, italicLabel, extra) {
    const wv = wave(rgba(italicC, 0.45));
    const sc = rgba(t.primary, 0.5);
    return `
      <div class="col">
        <div class="col-label" style="color:${textC}">${label}</div>
        <div class="text-sample">
          <div class="line" style="color:${textC}">这是一段正文，展示阅读时的视觉感受和主题氛围。文字需要清晰可读，又要保留主题的「调性」。</div>
          <div class="line">
            <span class="b" style="color:${boldC}">粗体强调</span><span style="color:${textC}"> 和 </span>
            <span class="i-wave" style="color:${italicC};background-image:${wv}">斜体术语</span><span style="color:${textC}"> 和 </span>
            <span class="mark-grad" style="color:${textC};background-image:${hl}">高亮标记</span><span style="color:${textC}"> 和 </span>
            <span class="s" style="color:#999;text-decoration-color:${sc}">删除线</span>
          </div>
          <div class="heading-row">
            <div class="h3-preview" style="color:${textC}">
              <span style="position:absolute;left:0;top:3px;width:4px;height:80%;border-radius:2px;background:${t.primary}"></span>
              三级标题示例
            </div>
          </div>
          <div class="line" style="color:${textC}">
            参见 <span class="link-preview" style="color:${italicC}">内部链接</span>
            和 <span class="tag-preview" style="color:${boldC};background:${rgba(boldC,0.1)};border:1px solid ${rgba(boldC,0.25)}">#标签</span>
          </div>
          <div class="bullet-row" style="color:${textC}">
            <span style="position:absolute;left:4px;top:50%;width:6px;height:6px;border-radius:50%;transform:translateY(-50%);background:${t.primary}"></span>
            列表项带 <span class="b" style="color:${boldC}">强调词</span>
          </div>
        </div>
        <div class="meta">
          正文 ${textC} (${contrast(textC, t.bg)}:1)<br>
          粗体 ${boldLabel}<br>
          斜体 ${italicLabel}
          ${extra||''}
        </div>
      </div>`;
  }

  // For "A 现状", re-pick secondary to be the contrasting one we hand-picked
  // (the old secondary was the harmonious one, not the emphasis one)
  return `
  <div class="theme-card">
    <div class="theme-card-header" style="background:${darken(t.bg,0.03)};color:${t.textOld}">
      ${t.name}
      <div class="seeds">
        <span class="label">3 种子:</span>
        <span class="dot" style="background:${t.primary}" title="primary"></span>
        <span class="dot" style="background:${t.secondary}" title="secondary"></span>
        <span class="dot" style="background:${t.bg};border-color:rgba(0,0,0,0.3)" title="bg"></span>
      </div>
    </div>
    <div class="theme-card-body" style="background:${t.bg}">
      ${renderCol(
        'A · 现状（带色调正文）',
        t.textOld, t.boldOld, t.italicOld,
        `${t.boldOld} (${contrast(t.boldOld, t.bg)}:1)`,
        `${t.italicOld} (${contrast(t.italicOld, t.bg)}:1)`,
        `<br><span style="color:${t.textOld}">⚠ 需 5 种子</span>`
      )}
      ${renderCol(
        'B · 中性黑正文 + 直接种子色',
        neutralText, boldB, italicB,
        `${boldB} (${contrast(boldB, t.bg)}:1)`,
        `${italicB} (${contrast(italicB, t.bg)}:1)`,
        `<br>✓ 仅需 3 种子`
      )}
      ${renderCol(
        'C · 微调正文 + 加深种子色',
        tintedText, boldC, italicC,
        `${boldC} (${contrast(boldC, t.bg)}:1)`,
        `${italicC} (${contrast(italicC, t.bg)}:1)`,
        `<br>✓ 仅需 3 种子`
      )}
    </div>
  </div>`;
}

function renderDark(t) {
  const wv = wave(rgba(t.secondary, 0.55));
  const hl = hlGrad(t.primary, 0.4);
  return `
  <div class="dark-card">
    <div class="dark-card-header" style="background:${t.headerBg};color:${t.text}">
      ${t.name}
      <div class="seeds">
        <span class="dot" style="background:${t.primary};border-color:rgba(255,255,255,0.2)"></span>
        <span class="dot" style="background:${t.secondary};border-color:rgba(255,255,255,0.2)"></span>
      </div>
    </div>
    <div class="dark-card-body" style="background:${t.bg}">
      <div class="text-sample" style="font-size:0.82em">
        <div class="line" style="color:${t.text}">正文展示，对比暗色模式的阅读感受。</div>
        <div class="line">
          <span class="b" style="color:${t.primary}">粗体强调</span><span style="color:${t.text}"> 和 </span>
          <span class="i-wave" style="color:${t.secondary};background-image:${wv}">斜体术语</span><span style="color:${t.text}"> 和 </span>
          <span class="mark-grad" style="color:${t.text};background-image:${hl}">高亮</span>
        </div>
        <div class="line" style="color:${t.text}">
          <span class="link-preview" style="color:${t.secondary}">链接</span>
          <span class="tag-preview" style="color:${t.primary};background:${rgba(t.primary,0.15)};border:1px solid ${rgba(t.primary,0.3)}">#标签</span>
        </div>
      </div>
      <div class="meta" style="color:#666">
        bold=primary (${contrast(t.primary,t.bg)}:1)　italic=secondary (${contrast(t.secondary,t.bg)}:1)
      </div>
    </div>
  </div>`;
}

// KEY: For this mockup, I've re-assigned secondary to be a CONTRASTING color
// (not the original harmonious one). This is the architectural change:
// primary = theme identity color, secondary = contrasting emphasis color
// See the theme definitions above - secondary is now the hand-picked contrast color

document.getElementById('grid').innerHTML = themes.map(renderCard).join('');
document.getElementById('dark-grid').innerHTML = darkThemes.map(renderDark).join('');
</script>
</body>
</html>
