<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phycat 新预设方案 Mockup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Serif SC', serif; background: #1a1a2e; color: #eee; padding: 24px 16px; line-height: 1.8; }
  h1 { text-align: center; font-size: 1.3em; margin-bottom: 4px; color: #fff; }
  .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.8em; }
  .section-title { text-align: center; font-size: 1em; margin: 30px 0 14px; padding: 6px 0; border-bottom: 1px solid #333; color: #bbb; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 16px; max-width: 1400px; margin: 0 auto; }
  .card { border-radius: 10px; overflow: hidden; box-shadow: 0 3px 16px rgba(0,0,0,0.3); }
  .card-header { padding: 8px 14px; font-weight: 700; font-size: 0.82em; display: flex; align-items: center; gap: 8px; }
  .seeds { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  .seeds .label { font-size: 0.65em; opacity: 0.5; font-weight: 400; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1.5px solid rgba(0,0,0,0.12); }
  .card-body { padding: 14px 16px; }
  .text-sample { font-size: 0.82em; line-height: 2.1; }
  .line { margin-bottom: 3px; }
  .b { font-weight: 700; }
  .i-wave { font-style: italic; padding-bottom: 2px; background-repeat: repeat-x; background-position: 0 100%; background-size: 6px 3px; }
  .mark-grad { padding: 0 3px; border-radius: 3px; background-repeat: no-repeat; background-position: 0 100%; background-size: 100% 40%; }
  .code-inline { font-family: monospace; font-size: 0.9em; padding: 1px 5px; border-radius: 4px; }
  .tag-pill { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 0.85em; font-weight: 500; }
  .link { position: relative; padding: 0 2px; font-weight: 500; text-decoration: none; }
  .link::before { content: '['; opacity: 0.5; margin-right: 1px; }
  .link::after { content: ']'; opacity: 0.5; margin-left: 1px; }
  .h3-bar { font-size: 1.05em; font-weight: 700; padding-left: 14px; position: relative; margin: 6px 0 4px; }
  .h3-bar::before { content: ''; position: absolute; left: 0; top: 3px; width: 4px; height: 80%; border-radius: 2px; }
  .meta { font-size: 0.58em; font-family: monospace; opacity: 0.4; margin-top: 6px; line-height: 1.5; }
  .new-badge { background: rgba(255,200,0,0.2); color: #f0c040; font-size: 0.7em; padding: 1px 6px; border-radius: 3px; font-weight: 400; }
</style>
</head>
<body>

<h1>Phycat 新预设方案</h1>
<p class="subtitle">现有 8 亮 + 3 暗，以下是补充方案</p>

<div class="section-title">☀️ 新浅色预设</div>
<div class="grid" id="light-grid"></div>

<div class="section-title">🌙 新暗色预设</div>
<div class="grid" id="dark-grid"></div>

<div class="section-title">📊 现有预设参考（调色后）</div>
<div class="grid" id="existing-grid"></div>

<script>
function hexToRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgba(h,a){const[r,g,b]=hexToRgb(h);return`rgba(${r},${g},${b},${a})`}
function darken(h,p){const[r,g,b]=hexToRgb(h);const f=1-p;return'#'+[r*f,g*f,b*f].map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('')}
function wave(c){return`linear-gradient(-45deg, transparent 35%, ${c} 35%, ${c} 65%, transparent 65%)`}
function hlGrad(h,a){return`linear-gradient(to top, ${rgba(h,a)}, transparent)`}
function contrast(a,b){
  function lum(h){let[r,g,b]=hexToRgb(h).map(c=>{c=c/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)});return 0.2126*r+0.7152*g+0.0722*b}
  const l1=lum(a),l2=lum(b);return((Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05)).toFixed(1)
}

const newLight = [
  {
    name: '🌺 Coral Reef', nameZh: '珊瑚礁',
    bg: '#fff5f0', primary: '#e8553d', secondary: '#1976d2',
    desc: '温暖珊瑚橘 + 海洋蓝对比'
  },
  {
    name: '🪻 Lavender Field', nameZh: '薰衣草田',
    bg: '#f8f5ff', primary: '#7c4dff', secondary: '#ef6c00',
    desc: '梦幻薰衣草紫 + 落日橙对比'
  },
  {
    name: '🏜️ Terra Cotta', nameZh: '陶土',
    bg: '#fdf6f0', primary: '#bf5b3c', secondary: '#2e7d32',
    desc: '大地赤陶 + 绿洲绿对比'
  },
  {
    name: '🫒 Olive Grove', nameZh: '橄榄林',
    bg: '#f7f8f2', primary: '#6d7c2f', secondary: '#ad1457',
    desc: '橄榄绿 + 浆果红对比'
  },
  {
    name: '🐚 Pearl', nameZh: '珍珠',
    bg: '#fafaf8', primary: '#4086a3', secondary: '#c62828',
    desc: '冷灰珍珠 + 朱红对比，极简克制'
  },
  {
    name: '🤍 Paper', nameZh: '素纸',
    bg: '#ffffff', primary: '#1a1a1a', secondary: '#b71c1c',
    desc: '纯白底 + 墨黑主色，朱砂红做斜体/链接唯一点缀'
  },
  {
    name: '🍵 Matcha', nameZh: '抹茶',
    bg: '#f5f9f0', primary: '#558b2f', secondary: '#6a1b9a',
    desc: '日式抹茶绿 + 紫藤对比'
  },
];

const newDark = [
  {
    name: '🔥 Ember', nameZh: '余烬',
    bg: '#1c1210', text: '#e8d5c4', primary: '#ff6b35', secondary: '#64b5f6',
    desc: '暖色系暗色，壁炉余烬感'
  },
  {
    name: '🌃 Neon City', nameZh: '霓虹都市',
    bg: '#0d0d1a', text: '#e0e0f0', primary: '#e040fb', secondary: '#00e5ff',
    desc: '赛博朋克霓虹，紫红 + 电光青'
  },
  {
    name: '🪨 Obsidian', nameZh: '黑曜石',
    bg: '#1a1a1a', text: '#c0c0c0', primary: '#78909c', secondary: '#ffab40',
    desc: '纯正黑岩质感，冷灰 + 琥珀点缀'
  },
  {
    name: '☕ Espresso', nameZh: '浓缩咖啡',
    bg: '#1b1513', text: '#d4c4b0', primary: '#d4a056', secondary: '#81c784',
    desc: '咖啡深棕，金调 + 薄荷绿对比'
  },
  {
    name: '🌌 Aurora', nameZh: '极光',
    bg: '#0a1628', text: '#c8d6e5', primary: '#26de81', secondary: '#a55eea',
    desc: '极地夜空，极光绿 + 星云紫'
  },
  {
    name: '🍷 Bordeaux', nameZh: '波尔多',
    bg: '#1a0f14', text: '#d9c4cc', primary: '#c0392b', secondary: '#f1c40f',
    desc: '红酒深红，酒红 + 金标对比'
  },
  {
    name: '🖤 Ink', nameZh: '墨',
    bg: '#0e0e0e', text: '#d4d4d4', primary: '#e0e0e0', secondary: '#e57373',
    desc: '纯黑底 + 银白主色，淡珊瑚红做斜体/链接唯一暖意'
  },
];

const existing = [
  { name: '🌸 Sakura', bg: '#fff7fa', primary: '#ff7096', secondary: '#bd93f9', dark: false },
  { name: '☁️ Sky', bg: '#f4faff', primary: '#3498db', secondary: '#c56200', dark: false },
  { name: '🌲 Forest', bg: '#f2f9f5', primary: '#11aa63', secondary: '#8e24aa', dark: false },
  { name: '🌊 Mint', bg: '#f4fdff', primary: '#0e9aa7', secondary: '#c2185b', dark: false },
  { name: '🟣 Mauve', bg: '#fafafc', primary: '#a06eb4', secondary: '#00838f', dark: false },
  { name: '🌅 Golden', bg: '#fffbeb', primary: '#d97706', secondary: '#4527a0', dark: false },
  { name: '🍒 Cheery', bg: '#fffbfb', primary: '#aa1141', secondary: '#00695c', dark: false },
  { name: '⚓ Prussian', bg: '#f0f6fa', primary: '#1a56db', secondary: '#c62828', dark: false },
  { name: '🧛 Vampire', bg: '#282a36', text: '#f8f8f2', primary: '#ff5555', secondary: '#bd93f9', dark: true },
  { name: '🌌 Abyss', bg: '#0f111a', text: '#d6deeb', primary: '#00b7c0', secondary: '#2e8bd6', dark: true },
  { name: '☢️ Radiation', bg: '#1b1d1b', text: '#e6e6e6', primary: '#4cd964', secondary: '#ffc107', dark: true },
];

function renderCard(t, isDark) {
  const text = isDark ? (t.text || '#e0e0e0') : '#2d2d2d';
  const muted = isDark ? darken(text, 0.2) : '#6b6b6b';
  const boldC = darken(t.primary, 0.15);
  const italicC = darken(t.secondary, 0.15);
  const wv = wave(rgba(italicC, 0.45));
  const hl = hlGrad(boldC, 0.35);
  const headerBg = isDark ? darken(t.bg, -0.1) : darken(t.bg, 0.03);

  return `
  <div class="card">
    <div class="card-header" style="background:${headerBg};color:${isDark ? text : '#333'}">
      ${t.name}
      ${t.nameZh ? `<span style="font-weight:400;opacity:0.6;font-size:0.85em">${t.nameZh}</span>` : ''}
      ${t.desc ? `<span class="new-badge">NEW</span>` : ''}
      <div class="seeds">
        <span class="label">P</span><span class="dot" style="background:${t.primary};border-color:${isDark?'rgba(255,255,255,0.2)':''}"></span>
        <span class="label">S</span><span class="dot" style="background:${t.secondary};border-color:${isDark?'rgba(255,255,255,0.2)':''}"></span>
      </div>
    </div>
    <div class="card-body" style="background:${t.bg}">
      <div class="text-sample">
        <div class="h3-bar" style="color:${text}">
          <span style="position:absolute;left:0;top:3px;width:4px;height:80%;border-radius:2px;background:${t.primary}"></span>
          三级标题示例
        </div>
        <div class="line" style="color:${text}">这是一段正文，展示主题的阅读氛围。清晰可读是第一要务。</div>
        <div class="line">
          <span class="b" style="color:${boldC}">粗体强调</span><span style="color:${text}"> 和 </span>
          <span class="i-wave" style="color:${italicC};background-image:${wv}">斜体术语</span><span style="color:${text}"> 和 </span>
          <span class="mark-grad" style="color:${text};background-image:${hl}">高亮标记</span>
        </div>
        <div class="line" style="color:${text}">
          <span class="link" style="color:${italicC}">内部链接</span>
          <span class="code-inline" style="color:${t.primary};background:${rgba(t.primary,0.1)};border:1px solid ${rgba(t.primary,0.15)}">inline code</span>
          <span class="tag-pill" style="color:${boldC};background:${rgba(boldC,0.1)};border:1px solid ${rgba(boldC,0.2)}">#标签</span>
        </div>
      </div>
      <div class="meta">
        ${t.desc || ''}<br>
        primary ${t.primary} (${contrast(t.primary, t.bg)}:1)
        secondary ${t.secondary} (${contrast(t.secondary, t.bg)}:1)
        bold ${boldC}　italic ${italicC}
      </div>
    </div>
  </div>`;
}

document.getElementById('light-grid').innerHTML = newLight.map(t => renderCard(t, false)).join('');
document.getElementById('dark-grid').innerHTML = newDark.map(t => renderCard(t, true)).join('');
document.getElementById('existing-grid').innerHTML = existing.map(t => renderCard(t, t.dark)).join('');
</script>
</body>
</html>
